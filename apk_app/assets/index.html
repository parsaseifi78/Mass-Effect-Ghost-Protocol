<style>
@font-face{font-family:Eurostile;src:url('assets/EurostileLTStd.ttf')}
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#05080c;overflow:hidden;font-family:Eurostile,Arial,sans-serif;color:#dfefff;position:fixed;inset:0;overscroll-behavior:none}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
canvas{display:block;position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#gl{z-index:1}#ui{z-index:2}
</style>

<body>
<canvas id="gl"></canvas>
<canvas id="ui"></canvas>

<script>
(function(){
  function go(){var d=document.documentElement,r=d.requestFullscreen||d.webkitRequestFullscreen||d.msRequestFullscreen;if(r){try{r.call(d);}catch(e){}}}
  ['pointerdown','touchstart','mousedown','keydown'].forEach(function(ev){window.addEventListener(ev,function(){go();},{once:true,passive:true});});
})();
</script>
